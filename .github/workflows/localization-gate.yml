name: Localization Gate

on:
  push:
  pull_request:

jobs:
  localization-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Localization Gate
        run: python localization_gate.py en.json ja_good.json
